<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MapChap – выгодные условия рядом</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e1e">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        #map { width: 100%; height: 100%; }

        /* Скрываем всё, что связано с Яндексом */
        .ymaps-2-1-79-copyright,
        .ymaps-2-1-79-map-copyrights-promo,
        .ymaps-2-1-79-controls__control,
        .ymaps-2-1-79-controls__bottom,
        .ymaps-2-1-79-controls__toolbar,
        ymaps[class*="copyright"],
        ymaps[class*="control"],
        .ymaps-2-1-79-route-panel,
        .ymaps-2-1-79-multiroute__panel {
            display: none !important;
        }

        /* Тёмная тема карты */
        .dark-map {
            filter: invert(1) hue-rotate(180deg) brightness(0.8) contrast(0.9);
        }

        /* === СТИЛЬ GLASS (МАТОВОЕ СТЕКЛО) === */
        .glass {
            background: rgba(25, 25, 35, 0.65);
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            color: #fff;
        }

        /* Логотип */
        .logo {
            position: absolute;
            top: 10px; left: 10px; z-index: 1000;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 600; font-size: 18px;
            display: flex; align-items: center;
            letter-spacing: 0.5px;
            transition: transform 0.2s ease;
        }
        .logo:hover { transform: scale(1.02); }
        .logo::before { content: "📍 "; margin-right: 6px; }

        /* Кнопка геолокации */
        .locate-btn {
            position: absolute;
            bottom: 110px; right: 15px; z-index: 1000;
            width: 46px; height: 46px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .locate-btn:active { 
            transform: scale(0.92); 
            background: rgba(0, 123, 255, 0.3);
        }

        /* Панель категорий */
        .category-bar {
            position: absolute;
            bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000;
            display: flex; gap: 8px;
            padding: 8px 14px;
            border-radius: 40px;
            flex-wrap: wrap; justify-content: center;
        }

        /* Кнопки категорий */
        .cat-btn {
            border: none;
            background: rgba(255, 255, 255, 0.06);
            color: #bbb;
            border-radius: 24px;
            padding: 8px 18px;
            font-size: 13.5px; font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            letter-spacing: 0.3px;
        }
        .cat-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            transform: translateY(-1px);
        }
        .cat-btn.active { 
            background: linear-gradient(135deg, #007bff, #4da3ff);
            color: white; 
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Анимированный индикатор местоположения (точка с пульсацией) */
        .pulse-marker {
            width: 20px; height: 20px;
            background: #007bff;
            border-radius: 50%;
            position: relative;
        }
        .pulse-marker::before {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            background: rgba(0,123,255,0.4);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 1; }
            50% { transform: scale(1.8); opacity: 0; }
            100% { transform: scale(0.8); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="logo glass">MapChap</div>
    <div id="map" class="dark-map"></div>

    <!-- Кнопка геолокации -->
    <div class="locate-btn glass" onclick="centerToUser()" title="Моё местоположение">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="3"></circle>
            <line x1="12" y1="2" x2="12" y2="6"></line>
            <line x1="12" y1="18" x2="12" y2="22"></line>
            <line x1="2" y1="12" x2="6" y2="12"></line>
            <line x1="18" y1="12" x2="22" y2="12"></line>
        </svg>
    </div>

    <!-- Панель категорий -->
    <div class="category-bar glass" id="categoryBar">
        <button class="cat-btn active" data-cat="all">Все</button>
        <button class="cat-btn" data-cat="beauty">Салон красоты</button>
        <button class="cat-btn" data-cat="auto">Автоуслуги</button>
        <button class="cat-btn" data-cat="med">Медцентр</button>
        <button class="cat-btn" data-cat="pharmacy">Аптека</button>
        <button class="cat-btn" data-cat="clothes">Магазин одежды</button>
        <button class="cat-btn" data-cat="grocery">Магазин продуктов</button>
        <button class="cat-btn" data-cat="electronics">Магазин техники</button>
        <button class="cat-btn" data-cat="appliances">Магазин бытовой техники</button>
    </div>

    <!-- Яндекс.Карты -->
    <script src="https://api-maps.yandex.ru/2.1/?apikey=07b74146-5f5a-46bf-a2b1-cf6d052a41bb&lang=ru_RU"></script>
    <script>
        // Правильный URL твоего API
        const API_URL = 'https://mapchap-backend.onrender.com/api/places';
        let map, userCoords, allPlaces = [];
        let userMarker = null;
        let currentRoute = null;

        const categoryColors = {
            beauty: 'violet',
            auto: 'blue',
            med: 'red',
            pharmacy: 'green',
            clothes: 'orange',
            grocery: 'yellow',
            electronics: 'cyan',
            appliances: 'brown'
        };

        // Запуск отслеживания геопозиции
        function startWatchingPosition() {
            if (!navigator.geolocation) return;
            navigator.geolocation.watchPosition(
                pos => {
                    userCoords = [pos.coords.latitude, pos.coords.longitude];
                    updateUserMarker(pos.coords.heading);
                },
                err => console.warn('Ошибка геолокации:', err.message),
                { enableHighAccuracy: true, maximumAge: 0 }
            );
        }

        // Обновление индикатора пользователя (стрелка или пульсация)
        function updateUserMarker(heading) {
            if (!userCoords) return;
            if (userMarker) map.geoObjects.remove(userMarker);

            let iconLayout;
            if (heading != null) {
                const rotation = heading;
                iconLayout = ymaps.templateLayoutFactory.createClass(
                    `<svg width="36" height="36" viewBox="-18 -18 36 36" style="transform: rotate(${rotation}deg);">
                        <circle cx="0" cy="0" r="16" fill="none" stroke="rgba(0,123,255,0.4)" stroke-width="4"/>
                        <polygon points="0,-14 8,10 -8,10" fill="white" stroke="rgb(0,123,255)" stroke-width="2"/>
                        <circle cx="0" cy="0" r="4" fill="rgb(0,123,255)"/>
                    </svg>`
                );
            } else {
                iconLayout = ymaps.templateLayoutFactory.createClass(
                    '<div class="pulse-marker"></div>'
                );
            }

            userMarker = new ymaps.Placemark(userCoords, {}, {
                iconLayout: 'default#imageWithContent',
                iconContentLayout: iconLayout,
                iconImageSize: [36, 36],
                iconImageOffset: [-18, -18],
                zIndex: 100
            });
            map.geoObjects.add(userMarker);
        }

        function initMap() {
            map = new ymaps.Map('map', {
                center: [55.76, 37.64],
                zoom: 13,
                controls: [],
                suppressMapOpenBlock: true
            });

            // Убираем мусор Яндекса
            const removeYmElements = () => {
                document.querySelectorAll('.ymaps-2-1-79-copyright, .ymaps-2-1-79-map-copyrights-promo, .ymaps-2-1-79-route-panel, .ymaps-2-1-79-multiroute__panel').forEach(el => {
                    el.style.display = 'none';
                    el.remove();
                });
            };
            setTimeout(removeYmElements, 200);
            map.events.add('boundschange', removeYmElements);

            startWatchingPosition();
            loadPlaces();
        }

        // Загрузка предложений из API
        async function loadPlaces() {
            try {
                const res = await fetch(API_URL);
                allPlaces = await res.json();
                renderMarkers('all');
            } catch (e) {
                console.error('Не удалось загрузить предложения', e);
            }
        }

        // Отображение маркеров на карте
        function renderMarkers(filterCat) {
            if (currentRoute) {
                map.geoObjects.remove(currentRoute);
                currentRoute = null;
            }
            map.geoObjects.removeAll();
            if (userCoords) updateUserMarker(userCoords.heading);

            const filtered = filterCat === 'all' 
                ? allPlaces 
                : allPlaces.filter(p => p.category === filterCat);

            filtered.forEach(place => {
                const coords = [place.lat, place.lng];
                const colorPreset = categoryColors[place.category] 
                    ? `islands#${categoryColors[place.category]}Icon` 
                    : 'islands#blueIcon';
                const marker = new ymaps.Placemark(coords, {
                    balloonContentHeader: place.name,
                    balloonContentBody: `
                        <p>${place.description}</p>
                        <p><b>Скидка: ${place.discount}</b></p>
                        <button onclick="buildRouteTo([${place.lat}, ${place.lng}])" style="padding: 5px 10px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">🚶 Проложить маршрут</button>
                    `,
                    hintContent: place.name
                }, { preset: colorPreset });
                map.geoObjects.add(marker);
            });
        }

        // Построение пешеходного маршрута
        function buildRouteTo(targetCoords) {
            if (!userCoords) {
                alert('Сначала определите ваше местоположение.');
                return;
            }
            if (currentRoute) map.geoObjects.remove(currentRoute);
            currentRoute = new ymaps.multiRouter.MultiRoute({
                referencePoints: [userCoords, targetCoords],
                params: { routingMode: 'pedestrian' }
            }, {
                viaPointsVisible: false,
                waypointsVisible: false,
                boundsAutoApply: true
            });
            map.geoObjects.add(currentRoute);
        }

        // Центрирование на пользователе
        function centerToUser() {
            if (userCoords) {
                map.setCenter(userCoords, 15, { duration: 300 });
            } else {
                alert('Геолокация пока недоступна. Разрешите доступ в браузере.');
            }
        }

        // Переключение категорий
        document.getElementById('categoryBar').addEventListener('click', e => {
            if (e.target.classList.contains('cat-btn')) {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                renderMarkers(e.target.dataset.cat);
            }
        });

        ymaps.ready(initMap);
    </script>
</body>
</html>
