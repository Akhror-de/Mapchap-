<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MapChap – выгодные условия рядом</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e1e">
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        #map { width: 100%; height: 100%; }

        .ymaps-2-1-79-copyright,
        .ymaps-2-1-79-map-copyrights-promo,
        .ymaps-2-1-79-controls__control,
        .ymaps-2-1-79-controls__bottom,
        .ymaps-2-1-79-controls__toolbar,
        ymaps[class*="copyright"],
        ymaps[class*="control"],
        .ymaps-2-1-79-route-panel,
        .ymaps-2-1-79-multiroute__panel {
            display: none !important;
        }

        .dark-map {
            filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.95);
        }

        .glass {
            background: rgba(20, 20, 28, 0.7);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            color: #fff;
        }

        .logo {
            position: absolute;
            top: 12px; left: 12px; z-index: 1000;
            padding: 8px 14px;
            border-radius: 30px;
            font-weight: 600; font-size: 18px;
            display: flex; align-items: center;
            letter-spacing: 0.5px;
            transition: transform 0.2s;
        }
        .logo:active { transform: scale(0.96); }
        .logo::before { content: "📍 "; margin-right: 6px; }

        .info-btn {
            position: absolute;
            top: 12px; left: 160px; z-index: 1000;
            width: 38px; height: 38px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(20,20,28,0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.15);
            color: #ccc;
        }
        .info-btn:active { transform: scale(0.92); background: rgba(0,123,255,0.3); }

        .locate-btn {
            position: absolute;
            bottom: 24px; right: 16px; z-index: 1000;
            width: 48px; height: 48px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.25s;
        }
        .locate-btn:active { transform: scale(0.9); background: rgba(0,123,255,0.25); }

        .cat-trigger {
            position: absolute;
            bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 1001;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600; font-size: 15px;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            background: linear-gradient(135deg, #007bff, #00b4ff);
        }
        .cat-trigger:active { transform: translateX(-50%) scale(0.95); }

        .category-panel {
            position: absolute;
            bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 1000;
            display: none;
            flex-wrap: wrap; gap: 8px; justify-content: center;
            padding: 10px 18px;
            border-radius: 40px;
            max-width: 95vw;
        }
        .category-panel.open { display: flex; }

        .cat-btn {
            border: none;
            background: rgba(255,255,255,0.08);
            color: #ddd;
            border-radius: 30px;
            padding: 9px 20px;
            font-size: 14px; font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .cat-btn:active { transform: scale(0.94); background: rgba(255,255,255,0.2); }
        .cat-btn.active {
            background: linear-gradient(135deg, #007bff, #00b4ff);
            color: white;
            box-shadow: 0 6px 18px rgba(0,123,255,0.5);
            border: 1px solid rgba(255,255,255,0.25);
            font-weight: 600;
        }

        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 2000;
            align-items: center; justify-content: center;
        }
        .modal.open { display: flex; }
        .modal-content {
            background: rgba(30,30,38,0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 24px;
            padding: 24px;
            max-width: 90%;
            width: 320px;
            color: #ddd;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .modal-content h3 { margin-top: 0; color: #fff; }
        .modal-content p { font-size: 14px; line-height: 1.5; }
        .modal-content a { color: #4da3ff; text-decoration: none; }
        .close-modal {
            margin-top: 16px;
            background: linear-gradient(135deg, #007bff, #00b4ff);
            border: none; color: white; padding: 10px 20px;
            border-radius: 30px; font-weight: 600; cursor: pointer;
            width: 100%; font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="logo glass">MapChap</div>
    <div class="info-btn glass" onclick="openInfo()" title="О приложении">ℹ️</div>
    <div id="map" class="dark-map"></div>

    <div class="locate-btn glass" onclick="centerToUser()" title="Моё местоположение">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="3"></circle>
            <line x1="12" y1="2" x2="12" y2="6"></line>
            <line x1="12" y1="18" x2="12" y2="22"></line>
            <line x1="2" y1="12" x2="6" y2="12"></line>
            <line x1="18" y1="12" x2="22" y2="12"></line>
        </svg>
    </div>

    <div class="cat-trigger" id="catTrigger" onclick="toggleCategories()">📋 Категории</div>

    <div class="category-panel glass" id="categoryPanel">
        <button class="cat-btn active" data-cat="all">Все</button>
        <button class="cat-btn" data-cat="beauty">Салон красоты</button>
        <button class="cat-btn" data-cat="auto">Автоуслуги</button>
        <button class="cat-btn" data-cat="med">Медцентр</button>
        <button class="cat-btn" data-cat="pharmacy">Аптека</button>
        <button class="cat-btn" data-cat="clothes">Магазин одежды</button>
        <button class="cat-btn" data-cat="grocery">Магазин продуктов</button>
        <button class="cat-btn" data-cat="electronics">Магазин техники</button>
        <button class="cat-btn" data-cat="appliances">Магазин бытовой техники</button>
        <button class="cat-btn" data-cat="flowers">Цветочный магазин</button>
        <button class="cat-btn" data-cat="restaurant">Ресторан</button>
        <button class="cat-btn" data-cat="cafe">Кафе</button>
    </div>

    <!-- О приложении (обновлённый юзернейм) -->
    <div class="modal" id="infoModal">
        <div class="modal-content glass">
            <h3>О приложении</h3>
            <p>MapChap помогает находить выгодные предложения рядом. Предприниматели добавляют акции через нашего Telegram-бота. Мы строго следим за контентом: запрещены темы войны, оружия, политики, наркотиков и финансовых пирамид.</p>
            <p>Добавить своё предложение: <a href="https://t.me/mapchaps_bot" target="_blank">@mapchaps_bot</a></p>
            <button class="close-modal" onclick="closeInfo()">Понятно</button>
        </div>
    </div>

    <script src="https://api-maps.yandex.ru/2.1/?apikey=07b74146-5f5a-46bf-a2b1-cf6d052a41bb&lang=ru_RU"></script>
    <script>
        const API_URL = 'https://mapchap-backend.onrender.com/api/places';
        let map, userCoords, allPlaces = [];
        let userMarker = null;
        let currentRoute = null;
        let currentHeading = null;

        const categoryColors = {
            beauty: 'violet', auto: 'blue', med: 'red', pharmacy: 'green',
            clothes: 'orange', grocery: 'yellow', electronics: 'cyan',
            appliances: 'brown', flowers: 'pink', restaurant: 'coral', cafe: 'coffee'
        };

        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (event) => {
                if (event.webkitCompassHeading) {
                    currentHeading = event.webkitCompassHeading;
                } else if (event.alpha !== null) {
                    currentHeading = event.alpha;
                }
                updateUserMarker();
            }, true);
        }

        function startWatchingPosition() {
            if (!navigator.geolocation) return;
            navigator.geolocation.watchPosition(
                pos => {
                    userCoords = [pos.coords.latitude, pos.coords.longitude];
                    if (currentHeading == null && pos.coords.heading != null) {
                        currentHeading = pos.coords.heading;
                    }
                    updateUserMarker();
                },
                err => console.warn('Ошибка геолокации:', err.message),
                { enableHighAccuracy: true, maximumAge: 0 }
            );
        }

        function updateUserMarker() {
            if (!userCoords) return;

            if (userMarker) {
                userMarker.geometry.setCoordinates(userCoords);
                const prevHasHeading = userMarker.properties.get('hasHeading');
                const nowHasHeading = currentHeading != null;
                if (prevHasHeading === nowHasHeading && nowHasHeading) {
                    const layout = userMarker.options.get('iconContentLayout');
                    if (layout && layout._element) {
                        layout._element.style.transform = `rotate(${currentHeading}deg)`;
                    }
                    return;
                }
                if (prevHasHeading === nowHasHeading && !nowHasHeading) {
                    return;
                }
                map.geoObjects.remove(userMarker);
                userMarker = null;
            }

            let iconLayout;
            if (currentHeading != null) {
                iconLayout = ymaps.templateLayoutFactory.createClass(
                    `<svg width="44" height="44" viewBox="-22 -22 44 44" style="transform: rotate(${currentHeading}deg); transition: transform 0.3s;">
                        <circle cx="0" cy="0" r="20" fill="none" stroke="rgba(0,123,255,0.5)" stroke-width="3"/>
                        <polygon points="0,-18 10,14 -10,14" fill="white" stroke="rgb(0,123,255)" stroke-width="2"/>
                        <circle cx="0" cy="0" r="6" fill="#007bff"/>
                    </svg>`
                );
            } else {
                iconLayout = ymaps.templateLayoutFactory.createClass(
                    '<div class="pulse-marker"></div>'
                );
            }

            userMarker = new ymaps.Placemark(userCoords, {}, {
                iconLayout: 'default#imageWithContent',
                iconContentLayout: iconLayout,
                iconImageSize: [44, 44],
                iconImageOffset: [-22, -22],
                zIndex: 100
            });
            userMarker.properties.set('hasHeading', currentHeading != null);
            map.geoObjects.add(userMarker);
        }

        function initMap() {
            map = new ymaps.Map('map', {
                center: [55.76, 37.64], zoom: 13,
                controls: [], suppressMapOpenBlock: true
            });
            const clean = () => {
                document.querySelectorAll('.ymaps-2-1-79-copyright, .ymaps-2-1-79-map-copyrights-promo, .ymaps-2-1-79-route-panel, .ymaps-2-1-79-multiroute__panel').forEach(el => { el.style.display='none'; el.remove(); });
            };
            setTimeout(clean, 300);
            map.events.add('boundschange', clean);
            startWatchingPosition();
            loadPlaces();
        }

        async function loadPlaces() {
            try {
                const res = await fetch(API_URL);
                allPlaces = await res.json();
                renderMarkers('all');
            } catch (e) { console.error(e); }
        }

        function renderMarkers(filterCat) {
            if (currentRoute) { map.geoObjects.remove(currentRoute); currentRoute = null; }
            map.geoObjects.removeAll();
            userMarker = null;
            updateUserMarker();

            const filtered = filterCat === 'all' ? allPlaces : allPlaces.filter(p => p.category === filterCat);
            filtered.forEach(place => {
                const coords = [place.lat, place.lng];
                const colorPreset = categoryColors[place.category] ? `islands#${categoryColors[place.category]}Icon` : 'islands#blueIcon';
                const marker = new ymaps.Placemark(coords, {
                    balloonContentHeader: place.name,
                    balloonContentBody: `<p>${place.description}</p><p><b>Скидка: ${place.discount}</b></p>
                        <button onclick="buildRouteTo([${place.lat},${place.lng}])" style="padding:6px 14px; background:#007bff; color:white; border:none; border-radius:20px; cursor:pointer; font-weight:bold;">🚶 Маршрут</button>`,
                    hintContent: place.name
                }, { preset: colorPreset });
                map.geoObjects.add(marker);
            });
        }

        function buildRouteTo(targetCoords) {
            if (!userCoords) { alert('Сначала определите местоположение.'); return; }
            if (currentRoute) map.geoObjects.remove(currentRoute);
            currentRoute = new ymaps.multiRouter.MultiRoute({
                referencePoints: [userCoords, targetCoords],
                params: { routingMode: 'pedestrian' }
            }, { viaPointsVisible: false, waypointsVisible: false, boundsAutoApply: true });
            map.geoObjects.add(currentRoute);
        }

        function centerToUser() {
            if (userCoords) { map.setCenter(userCoords, 15, { duration: 300 }); }
            else { alert('Геолокация недоступна.'); }
        }

        function toggleCategories() {
            const panel = document.getElementById('categoryPanel');
            panel.classList.toggle('open');
        }

        document.getElementById('categoryPanel').addEventListener('click', e => {
            if (e.target.classList.contains('cat-btn')) {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                renderMarkers(e.target.dataset.cat);
                document.getElementById('categoryPanel').classList.remove('open');
            }
        });

        function openInfo() { document.getElementById('infoModal').classList.add('open'); }
        function closeInfo() { document.getElementById('infoModal').classList.remove('open'); }
        document.getElementById('infoModal').addEventListener('click', function(e) {
            if (e.target === this) closeInfo();
        });

        ymaps.ready(initMap);
    </script>
</body>
</html>
