<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MapChap – выгодные предложения рядом | Карта скидок и акций</title>
    <meta name="description" content="MapChap – сервис, где предприниматели добавляют выгодные предложения, а вы видите их на карте. Акции, скидки, спецпредложения в вашем городе.">
    <meta name="keywords" content="скидки, акции, карта скидок, выгодные предложения, MapChap, местные скидки, рестораны, салоны красоты, аптеки">
    <meta name="theme-color" content="#1e1e1e">

    <!-- Open Graph -->
    <meta property="og:title" content="MapChap – выгодные предложения рядом">
    <meta property="og:description" content="Карта с акциями от местных предпринимателей. Найдите ближайшие скидки, рестораны, салоны и магазины.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mapchap.vercel.app/">
    <meta property="og:image" content="https://mapchap.vercel.app/icons/icon-512.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">

    <!-- Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MapChap">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png">

    <!-- PWA манифест -->
    <link rel="manifest" href="manifest.json">

    <!-- Проверка для Google Search Console (заменишь на свой код) -->
    <!-- <meta name="google-site-verification" content="ТВОЙ_КОД" /> -->
    <!-- Проверка для Яндекс.Вебмастер -->
    <!-- <meta name="yandex-verification" content="ТВОЙ_КОД" /> -->

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        #map { width: 100%; height: 100%; background: #111; }

        .glass {
            background: rgba(20, 20, 28, 0.7);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            color: #fff;
        }

        .logo {
            position: absolute;
            top: 12px; left: 12px; z-index: 1000;
            padding: 8px 14px;
            border-radius: 30px;
            font-weight: 600; font-size: 18px;
            display: flex; align-items: center;
            letter-spacing: 0.5px;
        }
        .logo::before { content: "📍 "; margin-right: 6px; }

        .info-btn {
            position: absolute;
            top: 12px; left: 160px; z-index: 1000;
            width: 38px; height: 38px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: bold;
            cursor: pointer;
            background: rgba(20,20,28,0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.15);
            color: #ccc;
        }

        .locate-btn {
            position: absolute;
            bottom: 24px; right: 16px; z-index: 1000;
            width: 48px; height: 48px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }

        .cat-trigger {
            position: absolute;
            bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 1001;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600; font-size: 15px;
            cursor: pointer;
            background: linear-gradient(135deg, #007bff, #00b4ff);
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
        }

        .category-panel {
            position: absolute;
            bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 1000;
            display: none;
            flex-wrap: wrap; gap: 8px; justify-content: center;
            padding: 10px 18px;
            border-radius: 40px;
            max-width: 95vw;
        }
        .category-panel.open { display: flex; }

        .cat-btn {
            border: none;
            background: rgba(255,255,255,0.08);
            color: #ddd;
            border-radius: 30px;
            padding: 9px 20px;
            font-size: 14px; font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .cat-btn:active { transform: scale(0.94); background: rgba(255,255,255,0.2); }
        .cat-btn.active {
            background: linear-gradient(135deg, #007bff, #00b4ff);
            color: white;
            box-shadow: 0 6px 18px rgba(0,123,255,0.5);
            border: 1px solid rgba(255,255,255,0.25);
            font-weight: 600;
        }

        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 2000;
            align-items: center; justify-content: center;
        }
        .modal.open { display: flex; }
        .modal-content {
            background: rgba(30,30,38,0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 24px;
            padding: 24px;
            max-width: 90%;
            width: 320px;
            color: #ddd;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .modal-content h3 { margin-top: 0; color: #fff; }
        .modal-content p { font-size: 14px; line-height: 1.5; }
        .modal-content a { color: #4da3ff; text-decoration: none; }
        .close-modal {
            margin-top: 16px;
            background: linear-gradient(135deg, #007bff, #00b4ff);
            border: none; color: white; padding: 10px 20px;
            border-radius: 30px; font-weight: 600; cursor: pointer;
            width: 100%; font-size: 14px;
        }

        .user-marker-container {
            width: 44px; height: 44px; position: relative; pointer-events: none;
        }
        .pulse-circle {
            position: absolute; top: 50%; left: 50%;
            width: 20px; height: 20px; margin-left: -10px; margin-top: -10px;
            background: #007bff; border-radius: 50%; display: none;
        }
        .pulse-circle::before {
            content: ''; position: absolute; top: -6px; left: -6px; right: -6px; bottom: -6px;
            background: rgba(0,123,255,0.4); border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 1; }
            50% { transform: scale(1.9); opacity: 0; }
            100% { transform: scale(0.8); opacity: 1; }
        }
        .compass-arrow { display: block; width: 100%; height: 100%; transition: transform 0.3s ease-out; }
    </style>
</head>
<body>
    <div class="logo glass">MapChap</div>
    <div class="info-btn glass" onclick="openInfo()" title="О приложении">ℹ️</div>
    <div id="map"></div>

    <div class="locate-btn glass" onclick="centerToUser()" title="Моё местоположение">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="3"></circle>
            <line x1="12" y1="2" x2="12" y2="6"></line>
            <line x1="12" y1="18" x2="12" y2="22"></line>
            <line x1="2" y1="12" x2="6" y2="12"></line>
            <line x1="18" y1="12" x2="22" y2="12"></line>
        </svg>
    </div>

    <div class="cat-trigger" id="catTrigger" onclick="toggleCategories()">📋 Категории</div>

    <div class="category-panel glass" id="categoryPanel">
        <button class="cat-btn active" data-cat="all">Все</button>
        <button class="cat-btn" data-cat="beauty">Салон красоты</button>
        <button class="cat-btn" data-cat="auto">Автоуслуги</button>
        <button class="cat-btn" data-cat="med">Медцентр</button>
        <button class="cat-btn" data-cat="pharmacy">Аптека</button>
        <button class="cat-btn" data-cat="clothes">Магазин одежды</button>
        <button class="cat-btn" data-cat="grocery">Магазин продуктов</button>
        <button class="cat-btn" data-cat="electronics">Магазин техники</button>
        <button class="cat-btn" data-cat="appliances">Магазин бытовой техники</button>
        <button class="cat-btn" data-cat="flowers">Цветочный магазин</button>
        <button class="cat-btn" data-cat="restaurant">Ресторан</button>
        <button class="cat-btn" data-cat="cafe">Кафе</button>
    </div>

    <div class="modal" id="infoModal">
        <div class="modal-content glass">
            <h3>О приложении</h3>
            <p>MapChap помогает находить выгодные предложения рядом. Предприниматели добавляют акции через Telegram-бота. Мы строго следим за контентом: запрещены темы войны, оружия, политики, наркотиков и финансовых пирамид.</p>
            <p>Добавить своё предложение: <a href="https://t.me/mapchaps_bot" target="_blank">@mapchaps_bot</a></p>
            <button class="close-modal" onclick="closeInfo()">Понятно</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <script>
        // Регистрация Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('SW registered', reg.scope))
                    .catch(err => console.error('SW error', err));
            });
        }

        // Публичный API (без секретов)
        const API_URL = 'https://mapchap-backend.onrender.com/api/places';
        let map, userCoords, userMarker = null, currentHeading = null;
        let allPlaces = [];
        let currentRoute = null;
        let currentFilter = 'all';

        // Защита от XSS
        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        const MIN_MOVE_DISTANCE = 5;
        const MIN_ANGLE_CHANGE = 10;
        let lastCoords = null;
        let lastHeading = null;

        // Словарь для конвертации русских названий (если остались в базе)
        const russianToCode = {
            "салон красоты": "beauty",
            "автоуслуги": "auto",
            "медцентр": "med",
            "аптека": "pharmacy",
            "магазин одежды": "clothes",
            "магазин продуктов": "grocery",
            "магазин техники": "electronics",
            "магазин бытовой техники": "appliances",
            "цветочный магазин": "flowers",
            "ресторан": "restaurant",
            "кафе": "cafe"
        };

        function normalizeCategory(cat) {
            if (!cat) return null;
            const lower = cat.toLowerCase().trim();
            if (/^[a-z]+$/.test(lower)) return lower;
            return russianToCode[lower] || null;
        }

        const darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '',
            subdomains: 'abcd',
            maxZoom: 19
        });

        const categoryColors = {
            beauty: '#8B00FF', auto: '#0000FF', med: '#FF0000', pharmacy: '#008000',
            clothes: '#FFA500', grocery: '#FFFF00', electronics: '#00FFFF',
            appliances: '#8B4513', flowers: '#FF69B4', restaurant: '#FF7F50', cafe: '#8B4513'
        };

        function initMap() {
            map = L.map('map', { 
                center: [55.76, 37.64], zoom: 13, 
                zoomControl: false, attributionControl: false 
            });
            darkLayer.addTo(map);
            startWatchingPosition();
            refreshPlaces();
            setupCompass();
            setInterval(refreshPlaces, 30000); // автообновление каждые 30 секунд
        }

        // Загрузка данных с API
        async function refreshPlaces() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error('Ошибка загрузки');
                const data = await res.json();
                allPlaces = data.map(p => ({
                    ...p,
                    category: normalizeCategory(p.category) || p.category
                }));
                applyFilter(currentFilter);
            } catch (e) {
                console.error(e);
            }
        }

        function applyFilter(filterCat) {
            currentFilter = filterCat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.cat === filterCat);
            });
            renderMarkers(filterCat);
        }

        // Отрисовка маркеров (с экранированием)
        function renderMarkers(filterCat) {
            map.eachLayer(layer => {
                if (layer instanceof L.Marker && layer !== userMarker) {
                    map.removeLayer(layer);
                }
            });
            if (currentRoute) { map.removeControl(currentRoute); currentRoute = null; }

            const filtered = filterCat === 'all' 
                ? allPlaces 
                : allPlaces.filter(p => p.category === filterCat);

            filtered.forEach(place => {
                const coords = [place.lat, place.lng];
                const color = categoryColors[place.category] || '#007bff';
                const marker = L.circleMarker(coords, {
                    radius: 8, fillColor: color, color: '#fff', weight: 2, opacity: 1, fillOpacity: 0.8
                }).addTo(map);

                // Безопасный попап
                const safeName = escapeHtml(place.name);
                const safeDesc = escapeHtml(place.description);
                const safeDiscount = escapeHtml(place.discount);
                const safeContact = escapeHtml(place.contact);
                const expiryStr = place.expiry ? `<i>Действует до: ${new Date(place.expiry.replace(' ', 'T')).toLocaleString('ru-RU')}</i><br>` : '';
                const contactStr = place.contact ? `<b>📞 Контакт:</b> ${safeContact}<br>` : '';
                
                const popupContent = `
                    <b>${safeName}</b><br>
                    ${safeDesc}<br>
                    <b>Скидка: ${safeDiscount}</b><br>
                    ${contactStr}
                    ${expiryStr}
                    <button onclick="buildRouteTo([${place.lat},${place.lng}])" style="background: rgba(0,123,255,0.9); border: none; color: white; padding: 6px 14px; border-radius: 20px; backdrop-filter: blur(8px); font-weight: 600; margin-top: 4px;">🚶 Маршрут</button>
                `;
                marker.bindPopup(popupContent);
            });
        }

        // Геолокация
        function startWatchingPosition() {
            if (!navigator.geolocation) return;
            navigator.geolocation.watchPosition(
                pos => {
                    const newCoords = [pos.coords.latitude, pos.coords.longitude];
                    if (lastCoords && distanceInMeters(lastCoords, newCoords) < MIN_MOVE_DISTANCE) return;
                    lastCoords = newCoords;
                    userCoords = newCoords;
                    updateUserMarkerPosition();
                },
                err => console.warn('Ошибка геолокации:', err.message),
                { enableHighAccuracy: true, maximumAge: 0 }
            );
        }

        function distanceInMeters(c1, c2) {
            const R = 6371000;
            const dLat = (c2[0] - c1[0]) * Math.PI / 180;
            const dLon = (c2[1] - c1[1]) * Math.PI / 180;
            const a = Math.sin(dLat/2) ** 2 + 
                      Math.cos(c1[0] * Math.PI / 180) * Math.cos(c2[0] * Math.PI / 180) * 
                      Math.sin(dLon/2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        // Компас
        let smoothHeading = null;
        const HEADING_SMOOTH = 0.3;

        function setupCompass() {
            const updateHeading = (alpha) => {
                if (alpha == null) return;
                let heading = (360 - (alpha % 360)) % 360;
                if (smoothHeading === null) smoothHeading = heading;
                else smoothHeading = smoothHeading * (1 - HEADING_SMOOTH) + heading * HEADING_SMOOTH;
                if (lastHeading !== null && Math.abs(smoothHeading - lastHeading) < MIN_ANGLE_CHANGE) return;
                lastHeading = smoothHeading;
                currentHeading = smoothHeading;
                updateUserMarkerHeading();
            };
            if ('ondeviceorientationabsolute' in window) {
                window.addEventListener('deviceorientationabsolute', (e) => {
                    if (e.alpha !== null) updateHeading(e.alpha);
                }, true);
            } else if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', (e) => {
                    if (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) {
                        updateHeading(e.webkitCompassHeading);
                    } else if (e.absolute && e.alpha !== null) {
                        updateHeading(e.alpha);
                    }
                }, true);
            }
        }

        function ensureUserMarker() {
            if (userMarker) return;
            const containerHtml = `
                <div class="user-marker-container">
                    <svg class="compass-arrow" viewBox="-22 -22 44 44" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="0" cy="0" r="20" fill="none" stroke="rgba(0,123,255,0.5)" stroke-width="3"/>
                        <polygon points="0,-18 10,14 -10,14" fill="white" stroke="#007bff" stroke-width="2"/>
                        <circle cx="0" cy="0" r="6" fill="#007bff"/>
                    </svg>
                    <div class="pulse-circle"></div>
                </div>`;
            const icon = L.divIcon({
                className: '',
                html: containerHtml,
                iconSize: [44, 44],
                iconAnchor: [22, 22]
            });
            userMarker = L.marker(userCoords || [55.76, 37.64], { icon, zIndexOffset: 1000 }).addTo(map);
            updateUserMarkerHeading();
        }

        function updateUserMarkerPosition() {
            if (!userCoords) return;
            ensureUserMarker();
            userMarker.setLatLng(userCoords);
        }

        function updateUserMarkerHeading() {
            ensureUserMarker();
            const container = userMarker._icon;
            if (!container) return;
            const pulse = container.querySelector('.pulse-circle');
            const arrow = container.querySelector('.compass-arrow');
            if (currentHeading != null) {
                pulse.style.display = 'none';
                arrow.style.display = 'block';
                arrow.style.transform = `rotate(${currentHeading}deg)`;
            } else {
                pulse.style.display = 'block';
                arrow.style.display = 'none';
            }
        }

        // Управление категориями
        function toggleCategories() {
            document.getElementById('categoryPanel').classList.toggle('open');
        }

        document.getElementById('categoryPanel').addEventListener('click', e => {
            if (e.target.classList.contains('cat-btn')) {
                const cat = e.target.dataset.cat;
                refreshPlaces().then(() => {
                    applyFilter(cat);
                    document.getElementById('categoryPanel').classList.remove('open');
                });
            }
        });

        // Маршруты
        function buildRouteTo(targetCoords) {
            if (!userCoords) { alert('Сначала определите местоположение.'); return; }
            if (currentRoute) map.removeControl(currentRoute);
            currentRoute = L.Routing.control({
                waypoints: [L.latLng(userCoords[0], userCoords[1]), L.latLng(targetCoords[0], targetCoords[1])],
                routeWhileDragging: false, showAlternatives: false,
                lineOptions: { styles: [{ color: '#007bff', opacity: 0.8, weight: 6 }] },
                createMarker: function() { return null; }
            }).addTo(map);
        }

        function centerToUser() {
            if (userCoords) map.setView(userCoords, 15);
            else alert('Геолокация недоступна.');
        }

        function openInfo() { document.getElementById('infoModal').classList.add('open'); }
        function closeInfo() { document.getElementById('infoModal').classList.remove('open'); }
        document.getElementById('infoModal').addEventListener('click', function(e) {
            if (e.target === this) closeInfo();
        });

        document.addEventListener('DOMContentLoaded', initMap);
    </script>
</body>
</html>
