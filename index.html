<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MapChap – выгодные условия рядом</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e1e">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        #map { width: 100%; height: 100%; background: #111; }

        .glass {
            background: rgba(20, 20, 28, 0.7);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            color: #fff;
        }

        .logo {
            position: absolute;
            top: 12px; left: 12px; z-index: 1000;
            padding: 8px 14px;
            border-radius: 30px;
            font-weight: 600; font-size: 18px;
            display: flex; align-items: center;
            letter-spacing: 0.5px;
        }
        .logo::before { content: "📍 "; margin-right: 6px; }

        .info-btn {
            position: absolute;
            top: 12px; left: 160px; z-index: 1000;
            width: 38px; height: 38px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: bold;
            cursor: pointer;
            background: rgba(20,20,28,0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.15);
            color: #ccc;
        }

        .locate-btn {
            position: absolute;
            bottom: 24px; right: 16px; z-index: 1000;
            width: 48px; height: 48px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }

        .cat-trigger {
            position: absolute;
            bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 1001;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600; font-size: 15px;
            cursor: pointer;
            background: linear-gradient(135deg, #007bff, #00b4ff);
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
        }

        .category-panel {
            position: absolute;
            bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 1000;
            display: none;
            flex-wrap: wrap; gap: 8px; justify-content: center;
            padding: 10px 18px;
            border-radius: 40px;
            max-width: 95vw;
        }
        .category-panel.open { display: flex; }

        .cat-btn {
            border: none;
            background: rgba(255,255,255,0.08);
            color: #ddd;
            border-radius: 30px;
            padding: 9px 20px;
            font-size: 14px; font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .cat-btn:active { transform: scale(0.94); background: rgba(255,255,255,0.2); }
        .cat-btn.active {
            background: linear-gradient(135deg, #007bff, #00b4ff);
            color: white;
            box-shadow: 0 6px 18px rgba(0,123,255,0.5);
            border: 1px solid rgba(255,255,255,0.25);
            font-weight: 600;
        }

        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 2000;
            align-items: center; justify-content: center;
        }
        .modal.open { display: flex; }
        .modal-content {
            background: rgba(30,30,38,0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 24px;
            padding: 24px;
            max-width: 90%;
            width: 320px;
            color: #ddd;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .modal-content h3 { margin-top: 0; color: #fff; }
        .modal-content p { font-size: 14px; line-height: 1.5; }
        .modal-content a { color: #4da3ff; text-decoration: none; }
        .close-modal {
            margin-top: 16px;
            background: linear-gradient(135deg, #007bff, #00b4ff);
            border: none; color: white; padding: 10px 20px;
            border-radius: 30px; font-weight: 600; cursor: pointer;
            width: 100%; font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="logo glass">MapChap</div>
    <div class="info-btn glass" onclick="openInfo()" title="О приложении">ℹ️</div>
    <div id="map"></div>

    <div class="locate-btn glass" onclick="centerToUser()" title="Моё местоположение">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="3"></circle>
            <line x1="12" y1="2" x2="12" y2="6"></line>
            <line x1="12" y1="18" x2="12" y2="22"></line>
            <line x1="2" y1="12" x2="6" y2="12"></line>
            <line x1="18" y1="12" x2="22" y2="12"></line>
        </svg>
    </div>

    <div class="cat-trigger" id="catTrigger" onclick="toggleCategories()">📋 Категории</div>

    <div class="category-panel glass" id="categoryPanel">
        <button class="cat-btn active" data-cat="all">Все</button>
        <button class="cat-btn" data-cat="beauty">Салон красоты</button>
        <button class="cat-btn" data-cat="auto">Автоуслуги</button>
        <button class="cat-btn" data-cat="med">Медцентр</button>
        <button class="cat-btn" data-cat="pharmacy">Аптека</button>
        <button class="cat-btn" data-cat="clothes">Магазин одежды</button>
        <button class="cat-btn" data-cat="grocery">Магазин продуктов</button>
        <button class="cat-btn" data-cat="electronics">Магазин техники</button>
        <button class="cat-btn" data-cat="appliances">Магазин бытовой техники</button>
        <button class="cat-btn" data-cat="flowers">Цветочный магазин</button>
        <button class="cat-btn" data-cat="restaurant">Ресторан</button>
        <button class="cat-btn" data-cat="cafe">Кафе</button>
    </div>

    <div class="modal" id="infoModal">
        <div class="modal-content glass">
            <h3>О приложении</h3>
            <p>MapChap помогает находить выгодные предложения рядом. Предприниматели добавляют акции через Telegram-бота. Мы строго следим за контентом: запрещены темы войны, оружия, политики, наркотиков и финансовых пирамид.</p>
            <p>Добавить своё предложение: <a href="https://t.me/mapchaps_bot" target="_blank">@mapchaps_bot</a></p>
            <button class="close-modal" onclick="closeInfo()">Понятно</button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Routing Machine JS -->
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <script>
        const API_URL = 'https://mapchap-backend.onrender.com/api/places';
        let map, userCoords, userMarker = null, currentHeading = null;
        let allPlaces = [];
        let currentRoute = null;

        // Тёмная тема CartoDB
        const darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>, &copy; CartoDB',
            subdomains: 'abcd',
            maxZoom: 19
        });

        const categoryColors = {
            beauty: '#8B00FF', auto: '#0000FF', med: '#FF0000', pharmacy: '#008000',
            clothes: '#FFA500', grocery: '#FFFF00', electronics: '#00FFFF',
            appliances: '#8B4513', flowers: '#FF69B4', restaurant: '#FF7F50', cafe: '#8B4513'
        };

        function initMap() {
            map = L.map('map', {
                center: [55.76, 37.64],
                zoom: 13,
                zoomControl: false,
                attributionControl: false
            });
            darkLayer.addTo(map);
            L.control.zoom({ position: 'topright' }).addTo(map);

            startWatchingPosition();
            loadPlaces();
            setupCompass();
        }

        function startWatchingPosition() {
            if (!navigator.geolocation) return;
            navigator.geolocation.watchPosition(
                pos => {
                    userCoords = [pos.coords.latitude, pos.coords.longitude];
                    if (currentHeading == null && pos.coords.heading != null) {
                        currentHeading = pos.coords.heading;
                    }
                    updateUserMarker();
                },
                err => console.warn('Ошибка геолокации:', err.message),
                { enableHighAccuracy: true, maximumAge: 0 }
            );
        }

        function setupCompass() {
            if ('ondeviceorientationabsolute' in window) {
                window.addEventListener('deviceorientationabsolute', (e) => {
                    if (e.alpha !== null) { currentHeading = e.alpha; updateUserMarker(); }
                }, true);
            } else if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', (e) => {
                    if (e.webkitCompassHeading) { currentHeading = e.webkitCompassHeading; updateUserMarker(); }
                    else if (e.absolute && e.alpha !== null) { currentHeading = e.alpha; updateUserMarker(); }
                }, true);
            }
        }

        function updateUserMarker() {
            if (!userCoords) return;
            if (userMarker) map.removeLayer(userMarker);

            let iconUrl;
            if (currentHeading != null) {
                const encoded = encodeURIComponent(`<svg width="44" height="44" viewBox="-22 -22 44 44" xmlns="http://www.w3.org/2000/svg"><circle cx="0" cy="0" r="20" fill="none" stroke="rgba(0,123,255,0.5)" stroke-width="3"/><polygon points="0,-18 10,14 -10,14" fill="white" stroke="#007bff" stroke-width="2"/><circle cx="0" cy="0" r="6" fill="#007bff"/></svg>`);
                iconUrl = `data:image/svg+xml;utf8,${encoded}`;
                const icon = L.icon({
                    iconUrl: iconUrl,
                    iconSize: [44, 44],
                    iconAnchor: [22, 22]
                });
                userMarker = L.marker(userCoords, { icon: icon, zIndexOffset: 1000 }).addTo(map);
                userMarker._icon.style.transform = `rotate(${currentHeading}deg)`;
                userMarker._icon.style.transition = 'transform 0.3s';
            } else {
                const icon = L.divIcon({
                    className: 'pulse-icon',
                    html: '<div class="pulse-marker"></div>',
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                });
                userMarker = L.marker(userCoords, { icon: icon, zIndexOffset: 1000 }).addTo(map);
            }
        }

        async function loadPlaces() {
            try {
                const res = await fetch(API_URL);
                allPlaces = await res.json();
                renderMarkers('all');
            } catch (e) { console.error(e); }
        }

        function renderMarkers(filterCat) {
            if (currentRoute) { map.removeControl(currentRoute); currentRoute = null; }
            map.eachLayer(layer => {
                if (layer instanceof L.Marker && layer !== userMarker) {
                    map.removeLayer(layer);
                }
            });

            const filtered = filterCat === 'all' ? allPlaces : allPlaces.filter(p => p.category === filterCat);
            filtered.forEach(place => {
                const coords = [place.lat, place.lng];
                const color = categoryColors[place.category] || '#007bff';
                const marker = L.circleMarker(coords, {
                    radius: 8,
                    fillColor: color,
                    color: '#fff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.8
                }).addTo(map);

                let popupContent = `<b>${place.name}</b><br>${place.description}<br><b>Скидка: ${place.discount}</b><br>`;
                if (place.expiry) {
                    const expiryDate = new Date(place.expiry.replace(' ', 'T'));
                    popupContent += `<i>Действует до: ${expiryDate.toLocaleString('ru-RU')}</i><br>`;
                }
                popupContent += `<button onclick="buildRouteTo([${place.lat},${place.lng}])" style="padding:4px 10px; background:#007bff; color:white; border:none; border-radius:15px;">🚶 Маршрут</button>`;

                marker.bindPopup(popupContent);
            });
        }

        function buildRouteTo(targetCoords) {
            if (!userCoords) { alert('Сначала определите местоположение.'); return; }
            if (currentRoute) map.removeControl(currentRoute);

            currentRoute = L.Routing.control({
                waypoints: [
                    L.latLng(userCoords[0], userCoords[1]),
                    L.latLng(targetCoords[0], targetCoords[1])
                ],
                routeWhileDragging: false,
                showAlternatives: false,
                lineOptions: {
                    styles: [{ color: '#007bff', opacity: 0.8, weight: 6 }]
                },
                createMarker: function() { return null; }
            }).addTo(map);
        }

        function centerToUser() {
            if (userCoords) { map.setView(userCoords, 15); }
            else { alert('Геолокация недоступна.'); }
        }

        function toggleCategories() {
            const panel = document.getElementById('categoryPanel');
            panel.classList.toggle('open');
        }

        document.getElementById('categoryPanel').addEventListener('click', e => {
            if (e.target.classList.contains('cat-btn')) {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                renderMarkers(e.target.dataset.cat);
                document.getElementById('categoryPanel').classList.remove('open');
            }
        });

        function openInfo() { document.getElementById('infoModal').classList.add('open'); }
        function closeInfo() { document.getElementById('infoModal').classList.remove('open'); }
        document.getElementById('infoModal').addEventListener('click', function(e) {
            if (e.target === this) closeInfo();
        });

        // Пульсация для случая без компаса
        const style = document.createElement('style');
        style.textContent = `
            .pulse-marker {
                width: 20px; height: 20px;
                background: #007bff;
                border-radius: 50%;
                position: relative;
            }
            .pulse-marker::before {
                content: '';
                position: absolute;
                top: -6px; left: -6px; right: -6px; bottom: -6px;
                background: rgba(0,123,255,0.4);
                border-radius: 50%;
                animation: pulse 2s infinite;
            }
            @keyframes pulse {
                0% { transform: scale(0.8); opacity: 1; }
                50% { transform: scale(1.9); opacity: 0; }
                100% { transform: scale(0.8); opacity: 1; }
            }
        `;
        document.head.appendChild(style);

        document.addEventListener('DOMContentLoaded', initMap);
    </script>
</body>
</html>
