<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; background: #1a1a2e; }
  canvas { border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
</style>
</head>
<body>
<canvas id="c" width="192" height="192"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// --- Фон (тёмно-синий с сеткой) ---
ctx.fillStyle = '#141432';
ctx.fillRect(0, 0, 192, 192);

// Лёгкая картографическая сетка
ctx.strokeStyle = 'rgba(255,255,255,0.06)';
ctx.lineWidth = 1;
for (let i = 0; i < 192; i += 16) {
  ctx.beginPath();
  ctx.moveTo(i, 0); ctx.lineTo(i, 192);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, i); ctx.lineTo(192, i);
  ctx.stroke();
}

// --- Пин (маркер карты) ---
const pinX = 96, pinY = 80;

// Тень пина
ctx.save();
ctx.shadowColor = 'rgba(0,0,0,0.6)';
ctx.shadowBlur = 12;
ctx.shadowOffsetY = 6;

// Основной градиент пина (синий → фиолетовый)
const grad = ctx.createLinearGradient(pinX - 28, pinY - 28, pinX + 28, pinY + 28);
grad.addColorStop(0, '#007bff');
grad.addColorStop(0.7, '#8b00ff');
ctx.fillStyle = grad;

// Рисуем пин: круг с вытянутым низом (как у стандартного маркера)
ctx.beginPath();
ctx.arc(pinX, pinY - 6, 22, 0, Math.PI * 2); // верхняя часть
ctx.closePath();
ctx.fill();
ctx.beginPath();
ctx.moveTo(pinX - 22, pinY - 8);
ctx.quadraticCurveTo(pinX, pinY + 30, pinX + 22, pinY - 8); // нижний треугольник
ctx.closePath();
ctx.fill();

ctx.restore(); // убираем тень

// Белая окантовка пина
ctx.strokeStyle = 'rgba(255,255,255,0.5)';
ctx.lineWidth = 2;
ctx.beginPath();
ctx.arc(pinX, pinY - 6, 22, 0, Math.PI * 2);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(pinX - 22, pinY - 8);
ctx.quadraticCurveTo(pinX, pinY + 30, pinX + 22, pinY - 8);
ctx.stroke();

// Буква "M" внутри пина
ctx.fillStyle = '#ffffff';
ctx.font = 'bold 26px "Segoe UI", Arial, sans-serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.shadowColor = 'transparent'; // убираем тень для текста
ctx.shadowBlur = 0;
ctx.fillText('M', pinX, pinY - 4);

// --- Визуальный «блик» на пине (эффект стекла) ---
ctx.save();
ctx.clip(); // ограничиваем область блика кругом пина (условно)
ctx.beginPath();
ctx.arc(pinX, pinY - 6, 22, 0, Math.PI * 2);
ctx.clip();
const glassGrad = ctx.createLinearGradient(pinX - 22, pinY - 28, pinX + 22, pinY + 16);
glassGrad.addColorStop(0, 'rgba(255,255,255,0.3)');
glassGrad.addColorStop(0.5, 'rgba(255,255,255,0.05)');
glassGrad.addColorStop(1, 'rgba(255,255,255,0.15)');
ctx.fillStyle = glassGrad;
ctx.fillRect(pinX - 30, pinY - 30, 60, 60);
ctx.restore();

// Конвертируем canvas в PNG и показываем как картинку для сохранения
const img = new Image();
img.src = canvas.toDataURL('image/png');
document.body.innerHTML = '';
document.body.style.background = '#1a1a2e';
document.body.style.display = 'flex';
document.body.style.alignItems = 'center';
document.body.style.justifyContent = 'center';
img.style.width = '192px';
img.style.height = '192px';
document.body.appendChild(img);
</script>
</body>
</html>
